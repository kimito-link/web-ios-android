# Android TWA の Gradle 設定（金型）。出どころ: Exosome/android-twa/gradle.properties
# bubblewrap init が生成する gradle.properties に、下記2行（useAndroidX / overridePathCheck）を必ず残すこと。
# 特に overridePathCheck は OneDrive\デスクトップ など非ASCII パス配下でビルドする場合に必須
# （これが無いと AGP がパスチェックでビルドを失敗させる）。

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx1536m

android.useAndroidX=true

# プロジェクトパスに非ASCII（例: OneDrive\デスクトップ）を含むとパスチェックがビルドを失敗させる。
# 明示的にオプトアウトすれば Gradle/AGP は処理できる。OneDrive 配下でビルドするなら残すこと。
android.overridePathCheck=true
