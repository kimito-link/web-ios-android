# 【金型テンプレート】Google Play 申請用ワークフロー（GitHub Actions 版・Capacitor）
#
# 移植元: partnership_program_website/.github/workflows/android-play-release.yml
#         (TWA/bubblewrap 版から Capacitor 版へ全面改修。iOS 版 ios-appstore-release.yml
#          の Capacitor ビルドパターンと対称。IAP(アプリ内課金)が必要なアプリは
#          TWA では Google Play Billing をネイティブに組み込めないため、この Capacitor 版を使う。
#          IAP 不要な単純な Web ラップだけなら TWA(bubblewrap)の方が軽量 — その場合は
#          過去バージョンの android-twa 版テンプレを参照。)
#
# - Capacitor で `android/` プロジェクトを生成し、`bundleRelease` でビルド、
#   Service Account 経由で Play Console に AAB をアップロードして指定トラックにリリースを作成する。
# - 初期トラックは `internal`（内部テスト）が安全。製品版に上げる準備ができたら下の
#   `PLAY_TRACK` を `production` に変更すると `changesNotSentForReview=false` で
#   Google レビューに自動送信される。
#
# ── このテンプレの使い方 ──────────────────────────────────────────
# 1. このファイルをアプリリポの `.github/workflows/android-play-release.yml` にコピー。
# 2. 下の <...> プレースホルダを app.config.json の値で置換する:
#      <PLAY_PACKAGE_NAME>  = stores.playPackageName (無ければ identity.bundleId)
#      <APP_NAME>           = identity.shortName (webDir stub の <title> に使用)
#      <PRODUCTION_URL>     = "https://" + identity.productionDomain  (審査スクショ取得元)
# 3. `PLAY_TRACK` を初回は internal、本番準備後に production へ。
# 4. 下の「必要な Secrets」を登録。リリース実体スクリプトは partnership からコピー。
#
# ── 必要な GitHub Secrets ────────────────────────────────────────
#   ANDROID_KEYSTORE_BASE64          android/ の upload-key .jks を base64 化
#                                    Windows PowerShell:
#                                      [Convert]::ToBase64String([IO.File]::ReadAllBytes('android-upload-key.jks'))
#   ANDROID_KEYSTORE_PROPERTIES      keystore.properties の中身そのもの（複数行）
#                                    例:
#                                      storePassword=xxx
#                                      keyPassword=xxx
#                                      keyAlias=upload
#   GOOGLE_PLAY_SA_JSON_BASE64       Google Cloud Service Account JSON を base64 化
#                                      [Convert]::ToBase64String([IO.File]::ReadAllBytes('sa.json'))
#   ── 任意（Data Safety / 審査スクショ）──
#   GOOGLE_PLAY_DATA_SAFETY_CSV         Data Safety フォーム入力 CSV（生）
#   GOOGLE_PLAY_DATA_SAFETY_CSV_BASE64  同 CSV を base64 化（どちらか）
#   IOS_REVIEW_DEMO_USERNAME            審査員用デモアカウント（ログイン必須アプリのみ）
#   IOS_REVIEW_DEMO_PASSWORD            同上パスワード
#
# - リリースノートは release-notes/CURRENT-ja.txt（500 文字以下）。
# - 一度に走るのは 1 リリースのみ（concurrency で過去 push の古いランは破棄）。
name: android-play-release

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-play-release.yml"
      - "capacitor.config.json"
      - "package.json"
      - "release-notes/CURRENT-ja.txt"
      - "scripts/play-publish.mjs"
      - "scripts/play-fill-listing.mjs"
      - "scripts/play-fill-data-safety.mjs"
      - "scripts/play-review-check.mjs"
      - "scripts/android-patch-signing.mjs"
      - "scripts/verify-android-signing-config.mjs"
      - "scripts/verify-signing-material-path.mjs"
      - "scripts/verify-android-splash-not-default.mjs"
      - "scripts/verify-webdir-consistency.mjs"
      - "scripts/check-splash-config.mjs"
      - "scripts/lib/splash-manifest.mjs"
      # Submit-time helpers that change runtime behaviour of the
      # Play release. Same lesson as the iOS workflow path-filter fix:
      # any script the workflow actually runs must appear here or
      # fixes to it can't retrigger a build.
      - "scripts/capture-play-screenshots.mjs"
      - "scripts/lib/play-api.mjs"
      - "store-assets/play/**"
      - "store-assets/appstore/app-icon-1024.png"
      - "app.config.json"

concurrency:
  group: android-play-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # ↓↓↓ app.config.json の値で置換 ↓↓↓
      PLAY_PACKAGE_NAME: <PLAY_PACKAGE_NAME>   # stores.playPackageName / 無ければ identity.bundleId
      APP_NAME: <APP_NAME>                     # identity.shortName
      # ↑↑↑ ここまで ↑↑↑
      # production = Google Play 製品版審査キューに入る (changesNotSentForReview=false)
      # internal にすると内部テストトラック止まりで審査されない。初回は internal 推奨。
      PLAY_TRACK: internal

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          GOOGLE_PLAY_SA_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SA_JSON_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PROPERTIES GOOGLE_PLAY_SA_JSON_BASE64; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        # Don't pass `version:` — package.json#packageManager pins the pnpm
        # version and pnpm/action-setup@v6 errors on multi-version specification.
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Capacitor Android toolchain + assets
        run: pnpm add --save-dev @capacitor/android@8 @capacitor/assets@3 @capacitor/splash-screen@8

      - name: Prepare webDir (Capacitor uses dist/public; server.url overrides at runtime)
        run: |
          mkdir -p dist/public
          if [ ! -f dist/public/index.html ]; then
            echo "<!doctype html><html><head><meta charset=\"utf-8\"><title>${APP_NAME}</title></head><body>loading...</body></html>" > dist/public/index.html
          fi

      - name: Verify webDir consistency (capacitor.config.ts vs Prepare webDir)
        run: node scripts/verify-webdir-consistency.mjs --expected dist/public

      - name: Add/copy Android platform
        run: |
          if [ ! -d android/app ]; then
            npx cap add android
          fi
          npx cap copy android

      - name: Generate or reuse app icon + splash, verify not shipping Capacitor defaults
        run: |
          set -euo pipefail
          MASTER="store-assets/appstore/app-icon-1024.png"
          mkdir -p assets
          if [ -f "$MASTER" ]; then
            echo "Using committed $MASTER"
            cp "$MASTER" assets/icon-only.png
          else
            echo "MASTER not committed — generating via icons:generate"
            pnpm icons:generate
            if [ ! -f "$MASTER" ]; then
              echo "::error::icons:generate did not produce $MASTER. Check scripts/generate-app-icons.mjs."
              exit 1
            fi
            cp "$MASTER" assets/icon-only.png
          fi
          # ★原版はリポにコミットされている前提（GOLDEN-RULES 原則7）。CI では生成しない。
          #   2026-08-24まで generate-capacitor-splash.mjs が「無ければ単色を作る」動作をしていたが、
          #   それは「原版が無い」というエラーを握りつぶし、誰もデザインしていない単色画面を
          #   ゲート素通りで出荷させる装置になっていた（fail-closed の逆）。原版が無いなら赤で止める。
          test -f assets/splash.png || { echo "::error::assets/splash.png（デザイン原版）が無い。store-assets のマスターをコミットすること"; exit 1; }
          # 生成「前」に、Capacitor デフォルトのスプラッシュ画像のハッシュを記録。
          node scripts/verify-android-splash-not-default.mjs --snapshot
          # 背景色は app.config.json のブランド値から読む（旧: '#0A0A0F' ハードコード）。
          # ★値は「テーマの明暗」でなく**スプラッシュ画像の地色**に合わせる（GOLDEN-RULES 原則3）。
          BG=$(node -p "JSON.parse(require('fs').readFileSync('app.config.json','utf8')).brand?.splashBackgroundColor ?? '#0A0A0F'")
          BG_DARK=$(node -p "JSON.parse(require('fs').readFileSync('app.config.json','utf8')).brand?.splashBackgroundColorDark ?? '$BG'")
          npx @capacitor/assets generate --android --androidProject android --assetPath assets --splashBackgroundColor "$BG" --splashBackgroundColorDark "$BG_DARK"
          # 生成「後」に、出荷される画像が Capacitor デフォルトのままでないことを確認（事故防止ゲート）。
          node scripts/verify-android-splash-not-default.mjs --verify
          # ★androidScaleType 未設定(既定=引き伸ばし)を検出（2026-08-24追加）。
          #   実測: このキット利用リポの過半数が既定のまま=Androidだけ縦に伸びていた。
          node scripts/check-splash-config.mjs

      - name: Set Android versionName/versionCode from package.json and CI run number
        run: |
          set -euo pipefail
          GRADLE="android/app/build.gradle"
          MARK_VER="$(node -p "require('./package.json').version")"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$MARK_VER\"/g" "$GRADLE"
          BN="${GITHUB_RUN_NUMBER:-0}"
          if [ "$BN" -le 1 ]; then
            BN="$(date +%s)"
          fi
          sed -i -E "s/versionCode [0-9]+/versionCode $BN/g" "$GRADLE"
          echo "versionName=$MARK_VER versionCode=$BN"
          echo "MARK_VER=$MARK_VER" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$BN" >> "$GITHUB_ENV"

      - name: Restore signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        # android-patch-signing.mjs が注入する storeFile("../android-upload-key.jks")と
        # rootProject.file("keystore.properties")は、どちらも android/app/build.gradle
        # からの相対解決＝android/ 直下を指す。ここに書かないと bundleRelease が
        # 「file doesn't exist」で落ちる(リポジトリルートに書くのは誤り)。
        # (2026-07-04 resend実戦で踏んだ地雷)
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/android-upload-key.jks
          printf '%s\n' "$ANDROID_KEYSTORE_PROPERTIES" > android/keystore.properties
          ls -l android/android-upload-key.jks android/keystore.properties

      - name: Verify signing material is at the path build.gradle expects
        run: node scripts/verify-signing-material-path.mjs --gradle android/app/build.gradle --keystore ../android-upload-key.jks

      # 未署名 AAB 出荷事故ゲート: bundleRelease の「前」に signingConfig を注入・検証。
      # Capacitor の `cap add android` は signingConfig を生成しないため、無いと
      # Play がアップロードを弾く。android-patch-signing.mjs で注入してから検証する。
      - name: Patch + verify build.gradle has signingConfig
        run: |
          node scripts/android-patch-signing.mjs --gradle android/app/build.gradle --keystore ../android-upload-key.jks
          node scripts/verify-android-signing-config.mjs --gradle android/app/build.gradle

      - name: Build release AAB
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease
          ls -l app/build/outputs/bundle/release/

      # iOS の IPA バージョン検証ゲートと対称: AAB に焼き込まれた versionName が
      # package.json と一致しているかをアップロード前に確認する（出荷ミス防止）。
      - name: Verify AAB versionName before upload
        # 2026-08-25: aapt2 dump badging が失敗した場合、以前は警告のみで続行していた
        #（＝versionName不一致を検出する唯一のゲートが、ツール互換性の問題で丸ごと無効化され、
        #   気付かれずに出荷される穴だった）。★測れなかった＝緑ではない、の原則どおり、
        #   抽出自体に失敗した場合もexit 1にしてfail-closedにする（このキットの3値exit規約：
        #   0=合格/1=測れた上での赤/2=測れなかった、のうち本ステップはCIをここで止める必要が
        #   あるため単純にfailにまとめる）。代替抽出経路(aapt2 dump xmltree等)の追加は
        #   実機のaapt2出力形式を検証してから行う(2026-08-25時点は未検証のため見送り)。
        run: |
          set -euo pipefail
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          GOT="$("$BUILD_TOOLS/aapt2" dump badging "$AAB_PATH" 2>/dev/null | grep -oE "versionName='[^']*'" | head -1 | sed -E "s/versionName='([^']*)'/\1/" || true)"
          if [ -z "$GOT" ]; then
            echo "::error::aapt2 dump badging で versionName を取得できませんでした。測れなかった状態のまま出荷しないため停止します(AAB形式非対応の古いbuild-toolsを使っている場合はBUILD_TOOLSのバージョンを見直してください)。"
            exit 1
          elif [ "$GOT" != "$MARK_VER" ]; then
            echo "::error::AAB の versionName ($GOT) が package.json ($MARK_VER) と一致しません。"
            exit 1
          else
            echo "AAB versionName=$GOT (expected $MARK_VER) — OK"
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Restore Service Account JSON
        env:
          GOOGLE_PLAY_SA_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SA_JSON_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .secrets
          printf '%s' "$GOOGLE_PLAY_SA_JSON_BASE64" | base64 -d > .secrets/google-play-sa.json
          # Sanity check (don't print contents).
          node -e "JSON.parse(require('fs').readFileSync('.secrets/google-play-sa.json','utf8')); console.log('SA JSON parsed OK')"

      # Regenerate release-notes/CURRENT-ja.txt from conventional-style
      # commit messages since the last v* tag. No-op if nothing
      # user-facing changed since the last release.
      - name: Regenerate ja release notes from commit messages
        run: |
          # Need full history for `git describe --tags`; checkout was shallow
          git fetch --tags --depth=0 origin || git fetch --tags --depth=100 origin || true
          node scripts/generate-release-notes.mjs --write || true
          echo '--- current release notes ---'
          cat release-notes/CURRENT-ja.txt
          echo '--- end ---'

      # Capture authenticated dashboard screenshots before the listing
      # upload step picks them up. Mirrors the iOS authenticated-capture
      # fix so Google reviewers see the post-login dashboard, not the
      # unauthenticated public LP. Hard-fails (exit 1) if reviewer creds
      # are missing for login-required apps.
      - name: Capture Play screenshots from prod URL (authenticated as reviewer)
        env:
          # ↓ "https://" + identity.productionDomain で置換
          SCREENSHOT_URL: <PRODUCTION_URL>
          IOS_REVIEW_DEMO_USERNAME: ${{ secrets.IOS_REVIEW_DEMO_USERNAME }}
          IOS_REVIEW_DEMO_PASSWORD: ${{ secrets.IOS_REVIEW_DEMO_PASSWORD }}
        run: |
          pnpm exec playwright install --with-deps chromium || npx --yes playwright@1.49 install --with-deps chromium
          node scripts/capture-play-screenshots.mjs
          ls -la store-assets/play/screenshots

      # Push store listing, developer contact, and store graphics into Play
      # Console via Android Publisher API. This is idempotent and runs before
      # the AAB publish step so Google reviewers see the correct metadata.
      - name: Pre-fill Play listing + developer contact + graphics
        env:
          GOOGLE_PLAY_SA_JSON_PATH: .secrets/google-play-sa.json
          PLAY_PREFILL_ALLOW_PERMISSION_SKIP: "1"
        run: node scripts/play-fill-listing.mjs

      - name: Pre-fill Play Data Safety from CSV (if provided)
        env:
          GOOGLE_PLAY_SA_JSON_PATH: .secrets/google-play-sa.json
          PLAY_DATA_SAFETY_CSV: ${{ secrets.GOOGLE_PLAY_DATA_SAFETY_CSV }}
          PLAY_DATA_SAFETY_CSV_BASE64: ${{ secrets.GOOGLE_PLAY_DATA_SAFETY_CSV_BASE64 }}
          # Soft-fail on 403 (SA missing "Manage store presence") so the
          # release pipeline keeps building during the one-time UI grant.
          PLAY_PREFILL_ALLOW_PERMISSION_SKIP: "1"
        # scripts/play-fill-data-safety.mjs は各アプリのセットアップ時にコピーし忘れる
        # ことがある(金型 templates/scripts/ には実装済み)。無い場合はスキップする
        # — データセーフティは Play Console UI で手動入力する運用でも支障ない。
        # CSV自動投入を使うアプリは play-fill-data-safety.mjs / play-generate-data-safety-csv.mjs /
        # lib/play-data-safety-template.json の3点をコピーすること。
        # (2026-07-04 resend実戦: コピー漏れのままworkflowだけ呼んでおりMODULE_NOT_FOUNDで
        #  パイプライン全体が失敗する地雷を踏んだ)
        run: |
          if [ -f scripts/play-fill-data-safety.mjs ]; then
            node scripts/play-fill-data-safety.mjs --optional
          else
            echo "::notice::scripts/play-fill-data-safety.mjs not found — skipping (Data Safety is filled manually in Play Console)."
          fi

      - name: Publish to Play Console (uses $PLAY_TRACK)
        env:
          GOOGLE_PLAY_SA_JSON_PATH: .secrets/google-play-sa.json
          PLAY_AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
        run: node scripts/play-publish.mjs

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f .secrets/google-play-sa.json
          rm -f android/android-upload-key.jks
          rm -f android/keystore.properties
