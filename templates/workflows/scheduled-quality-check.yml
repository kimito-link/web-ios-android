# 【金型テンプレート】公開サイトの品質を定期チェック（セキュリティスコア・レスポンシブ設計・Lighthouse）
#
# 移植元: web-ios-android キット新規実装（2026-08-25。設計: _docs/instruments/SECURITY-SCORE.md / RESPONSIVE-CHECK.md）
#
# 背景:
#   security:score（malwarecheck.site基準の出荷前セキュリティチェック）と
#   responsive:check（レスポンシブ設計の静的先取りチェック）は、iOS/Androidの
#   出荷事故ゲートと違い、デプロイ手段（Vercel/Cloudflare Pages等）を問わず
#   どのCIワークフローにも配線されていなかった（2026-08-25の監査で発見）。
#   このキットが既定で使うVercelはGit連携の自動デプロイでCIステップを挟まないため、
#   デプロイ後に別トリガーで定期チェックする形にする。
#   Lighthouse（性能・アクセシビリティ・SEO・ベストプラクティス計測）も同時に
#   2026-08-25の計器抜け漏れ調査で「一度も計測されていない」ことが判明したため追加。
#   Chrome起動を伴い実行時間が長いため、毎push実行ではなくこの週次チェックに含める。
#
# ── このテンプレの使い方 ──────────────────────────────────────────
# 1. このファイルをアプリリポの `.github/workflows/scheduled-quality-check.yml` にコピー。
# 2. 次の3本をアプリリポの `scripts/` にコピーする（キットの templates/scripts/ から）:
#      verify-security-score.mjs / verify-responsive-design.mjs / verify-external-links.mjs
#    （依存: scripts/lib/instrument-core.mjs。無ければ一緒にコピーする）
# 3. 下の <PRODUCTION_DOMAIN> と <STATIC_DIR> を置換する:
#      <PRODUCTION_DOMAIN> = app.config.json の identity.productionDomain（例: voice.kimito.link）
#      <STATIC_DIR>        = 公開する静的HTML/CSSがあるディレクトリ（例: lp。実在するパスにすること）
# 4. lighthouserc.json をリポ直下にコピーする（サイト固有の閾値に調整可。無ければ Lighthouse は skip）。
# 5. 必要なら cron のスケジュールを変更する（既定: 週1回・月曜9時JST）。
#
# ★★2026-10-04 に書き直した理由（kimito-link-voice で実際に4週連続の失敗を出した）:
#   旧版は `node templates/scripts/…`（＝キット自身の中の配置）を前提にしていて、アプリリポで
#   そのまま使うと「Cannot find module」で毎週失敗した。さらにこの3本のスクリプトは
#   リポの根を `__dirname/../..` で解決する（キットの templates/scripts/ 配置が前提）ため、
#   アプリの `scripts/`（1階層）に置くと根が1つ上にずれ、app.config.json も対象ディレクトリも
#   見失う。ずれの影響を受けないよう、★URL は --url で明示し、★ディレクトリはフルパスで渡す。
#   （根本解決はスクリプト側で根を「app.config.json が見つかるまで上へ辿る」方式にすること）
# ★各検査は if: always() で独立させてある（先の検査が赤でも後の検査を走らせる）。
#   continue-on-error は使わない＝1つでも赤ならジョブは赤のまま（見せかけの緑にしない）。
#
# ── 必要な GitHub Secrets ────────────────────────────────────────
#   なし（外部認証不要のチェックのみ）
name: scheduled-quality-check

on:
  schedule:
    # 月曜 0:00 UTC = 月曜 9:00 JST
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

concurrency:
  group: scheduled-quality-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Security score (内部先取り + malwarecheck.site本体実測)
        run: node scripts/verify-security-score.mjs --url https://<PRODUCTION_DOMAIN>

      - name: Responsive design (静的先取りチェック)
        if: always()
        run: node scripts/verify-responsive-design.mjs <STATIC_DIR>

      - name: Install Lighthouse CI (lighthouserc.json が無ければこのステップごとskip)
        if: always() && hashFiles('lighthouserc.json') != ''
        run: npm install --no-save @lhci/cli@^0.15.1

      - name: Lighthouse (performance / accessibility / SEO / best-practices)
        if: always() && hashFiles('lighthouserc.json') != ''
        run: npx lhci autorun --config=lighthouserc.json

      - name: External links (静的ディレクトリ内のストアバッジ等・外部リンクの到達性)
        if: always()
        run: |
          npm install --no-save linkinator@^8.0.4
          node scripts/verify-external-links.mjs "$GITHUB_WORKSPACE/<STATIC_DIR>"
