# 【金型テンプレート】iOS Capacitor シェル「作り分けない」ガードレール
#
# server.url リモート読込型アプリは、動く金型(リバースハック / 富士山解決後)と
# 同型・最小実装を保つ。過去に富士山が独自の VC / UIWindow / AppDelegate 注入で
# 「作り分け」した結果、起動黒画面で約2ヶ月10回失敗した(_docs/CAPACITOR-GOLDEN-RULES.md)。
#
# このワークフローは patch-ios-launch-dark.mjs に「作り分け」(独自ネイティブ注入)が
# 再混入していないかを機械検査する。違反なら赤で止め人間に説明を求める。
# 「気合で守る原則」を「コードで守る原則」に格上げするのが目的(原則6)。
#
# キットからの移植時: このファイルをそのまま使える(禁止パターンはアプリ非依存に一般化済み)。
name: ios-shell-guardrail

on:
  pull_request:
    paths:
      - 'scripts/patch-ios-launch-dark.mjs'
      - '.github/workflows/ios-shell-guardrail.yml'
      # 2026-08-25: 検出ロジックはpatch-ios-launch-dark.mjs専用のまま(未検証の
      # 新パターンは追加しない)だが、AppDelegate.swift/Podfileの直接編集は
      # 原則6「作り分けない」が本来カバーすべき範囲。少なくとも変更時に
      # このガードが走る(=人間の目に留まる)よう trigger path だけ広げる。
      - 'ios/App/App/AppDelegate.swift'
      - 'ios/App/Podfile'
  push:
    branches: [main]
    paths:
      - 'scripts/patch-ios-launch-dark.mjs'
      - '.github/workflows/ios-shell-guardrail.yml'
      - 'ios/App/App/AppDelegate.swift'
      - 'ios/App/Podfile'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Forbid app-specific native injections (custom VC / UIWindow / pbxproj rewrite)
        run: |
          set -euo pipefail
          PATCH="scripts/patch-ios-launch-dark.mjs"
          test -f "$PATCH" || (echo "::error::$PATCH が見つかりません"; exit 1)

          # コメント(// と /* */)を除いた実行コードだけを検査する。コメントには過去の
          # 経緯説明で禁止パターン名を引用することがあるため(POSTMORTEM 的役割)、
          # それを禁止すると教訓が失われる。strip-comments.mjs が無ければ素の grep でも可。
          if [ -f scripts/strip-comments.mjs ]; then
            CODE_ONLY=$(node scripts/strip-comments.mjs "$PATCH")
          else
            CODE_ONLY=$(sed -E 's://.*$::' "$PATCH" | sed -E '/\/\*/,/\*\//d')
          fi

          violations=0
          check_absent() {
            local pattern="$1"; local reason="$2"
            if echo "$CODE_ONLY" | grep -qE "$pattern"; then
              echo "::error file=$PATCH::禁止パターン検出(コメント除く実行コード内): $pattern — $reason"
              violations=$((violations + 1))
            fi
          }

          # 起動黒画面の真因となった「独自ネイティブ注入」を一般パターンで検出する。
          # 富士山の FujisanBridgeViewController は一例。任意アプリの独自 VC 注入を禁じる。
          check_absent 'BridgeViewController'        '独自 Bridge VC 注入は禁止。Main.storyboard customClass/customModule 矛盾で WKWebView が生成されない黒画面の真因(作り分けない原則)'
          check_absent 'ViewController.*customClass' '独自 VC を storyboard customClass に注入するのは禁止'
          check_absent 'addSwiftFileToPbxproj'       'project.pbxproj への Swift 注入は禁止(金型同型に保つ)'
          check_absent 'patchMainStoryboard'         'Main.storyboard customClass 書換は禁止(rootViewController 生成失敗の原因)'
          check_absent 'UIWindow\.Level\.alert'      '最前面 UIWindow オーバーレイは禁止(コンテンツを覆い黒画面を生む過去事故)'
          check_absent 'dark-?[Ww]indow|darkCover'   '最前面ダークオーバーレイ注入は禁止(コンテンツ覆い隠しの過去事故)'
          check_absent 'SplashDone.*poll|JS.*解除ポーリング' 'JS 解除ポーリングは禁止(最大20秒黒画面の過去事故)'

          # patch script が肥大化していないか(金型は 80 行台)
          lines=$(wc -l < "$PATCH")
          MAX_LINES=200
          if [ "$lines" -gt "$MAX_LINES" ]; then
            echo "::error file=$PATCH::patch-ios-launch-dark.mjs が $lines 行に肥大化(上限 $MAX_LINES 行)"
            echo "「最小実装を保つ」原則違反の疑い。新機能の前に、本当に必要か・金型アプリも同じ修正を入れるべきかを確認すること。"
            violations=$((violations + 1))
          else
            echo "patch script size: $lines lines (limit $MAX_LINES) ✓"
          fi

          if [ "$violations" -gt 0 ]; then
            echo ""
            echo "::error::$violations 件の違反を検出。詳細は上記ログ参照。"
            echo "iOS Capacitor シェルは「金型(リバースハック)同型最小実装」を保つ原則です。"
            echo "本当に必要な修正なら、まず金型アプリ側で同じ修正を入れ、両者を揃えてからこのガードを更新してください。"
            exit 1
          fi
          echo ""
          echo "✓ ios-shell-guardrail: patch script は最小実装を保っています"
