# 【金型テンプレート】iOS / App Store 申請の事前 lint
#
# 移植元: partnership_program_website/.github/workflows/ios-pre-submission-lint.yml
#
# ios-appstore-release が Apple に送る「前」に、既知の reject ベクタを
# 機械検査して赤で止める。Runs:
#   - iOS 申請に関係するファイルを触る PR 全部
#   - main への push（ios-appstore-release と対）
#   - workflow_dispatch（手動）
#
# Failure-mode mapping (Guideline → check)（実体は scripts/lint-pre-submission.mjs）:
#   5.1.1(v) — アカウント削除導線 + ページ + API procedure
#   2.3.10  — 他プラットフォーム文字列が release-notes / store metadata に混入
#   4.8 + 3.1.3(f) — reviewer-notes テンプレに Apple 文言の逐語引用
#   2.1(a) + 4.8 — iOS の Google 隠し3層 (fn + CSS + observer)
#   meta     — package.json semver + bundle ID 整合
#
# ── このテンプレの使い方 ──────────────────────────────────────────
# 1. このファイルをアプリリポの `.github/workflows/ios-pre-submission-lint.yml` にコピー。
# 2. 下の paths の `client/src/**` は「Web フロントのソース」を指す。自リポの
#    Web ソースの場所に合わせて書き換える（例: `src/**` / `app/**` / `web/**`）。
# 3. scripts/lint-pre-submission.mjs を partnership からコピー。検査ルールは
#    アプリ固有の reject 履歴に応じてスクリプト側で調整する。
#
# ── 必要な GitHub Secrets ────────────────────────────────────────
#   （なし。静的 lint のみ。app.config.json / リポ内ファイルだけで完結）
name: ios-pre-submission-lint

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "package.json"
      - "client/src/**"   # ← 自リポの Web フロントソースの場所に合わせて変更
      - "scripts/appstore-submit.mjs"
      - "scripts/asc-patch-review-detail.mjs"
      - "scripts/lint-pre-submission.mjs"
      - "release-notes/**"
      - "store-assets/appstore/**"
      - "capacitor.config.json"
      - "app.config.json"
      - ".github/workflows/ios-pre-submission-lint.yml"
  pull_request:
    paths:
      - "package.json"
      - "client/src/**"   # ← 自リポの Web フロントソースの場所に合わせて変更
      - "scripts/appstore-submit.mjs"
      - "scripts/asc-patch-review-detail.mjs"
      - "scripts/lint-pre-submission.mjs"
      - "release-notes/**"
      - "store-assets/appstore/**"
      - "capacitor.config.json"
      - "app.config.json"

permissions:
  contents: read

concurrency:
  group: ios-pre-submission-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run pre-submission lint
        run: node scripts/lint-pre-submission.mjs
