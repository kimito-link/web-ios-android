<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Google Sans", Roboto, Arial, sans-serif; background: #fff; color: #202124; }
  #capture-root { width: 1180px; }
  .top { background: #fff; border-bottom: 1px solid #dadce0; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  .top img { width: 28px; height: 28px; background: #4285f4; border-radius: 4px; }
  .top b { font-size: 18px; }
  .main { padding: 24px 28px; }
  h1 { font-size: 22px; font-weight: 400; margin-bottom: 20px; }
  .item { border: 1px solid #dadce0; border-radius: 8px; padding: 16px 20px; display: flex; gap: 16px; align-items: center; max-width: 820px; }
  .item.hl { border-color: #1a73e8; background: #e8f0fe; }
  .ico { width: 48px; height: 48px; border-radius: 8px; background: #164479; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .meta { flex: 1; }
  .meta b { font-size: 16px; display: block; margin-bottom: 4px; }
  .meta span { font-size: 13px; color: #5f6368; }
  .status { font-size: 13px; color: #137333; background: #e6f4ea; padding: 4px 10px; border-radius: 4px; }
  .note { margin-top: 16px; font-size: 13px; color: #5f6368; max-width: 820px; }
  code { background: #f1f3f4; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div id="capture-root">
  <div class="top"><div class="top img"></div><b>Chrome ウェブストア デベロッパー ダッシュボード</b></div>
  <div class="main">
    <h1>アイテム</h1>
    <div class="item hl">
      <div class="ico">WH</div>
      <div class="meta">
        <b>君斗りんくのWEBサイト健康診断</b>
        <span>拡張機能 · v8.6.71 · ID: <code>jnfpngacnacjfhpphpnlgbpjmklbhdlf</code></span>
      </div>
      <span class="status">審査中</span>
    </div>
    <p class="note">初回だけ zip を手動アップロードしてアイテム枠を作成。URL 末尾32文字 = <code>CWS_ITEM_ID</code>（以降ずっと同じ）。</p>
  </div>
</div>
</body>
</html>
