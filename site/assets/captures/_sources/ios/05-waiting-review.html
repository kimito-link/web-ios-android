<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: #f5f5f7; color: #1d1d1f; }
  #capture-root { width: 1180px; background: #f5f5f7; }
  .top { background: #fff; border-bottom: 1px solid #d2d2d7; padding: 14px 24px; font-size: 14px; }
  .main { padding: 24px 28px; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .ver { color: #6e6e73; font-size: 14px; margin-bottom: 20px; }
  .badge { display: inline-block; background: #fff3cd; color: #856404; border: 1px solid #f5d76e; border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
  .card { background: #fff; border: 1px solid #d2d2d7; border-radius: 12px; padding: 20px; max-width: 820px; margin-top: 12px; }
  .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e8e8ed; font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .icon { width: 48px; height: 48px; border-radius: 10px; background: #164479; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; margin-right: 12px; vertical-align: middle; }
  .build { font-family: ui-monospace, monospace; color: #0071e3; }
</style>
</head>
<body>
<div id="capture-root">
  <div class="top">君斗りんくのWEBサイト健康診断 › iOS App › 1.0.0</div>
  <div class="main">
    <h1><span class="icon">✓</span>1.0.0 審査中</h1>
    <p class="ver">ビルド <span class="build">10</span> · 提出日 2026年6月13日</p>
    <span class="badge hl">審査待ち (Waiting for Review)</span>
    <div class="card">
      <div class="row"><span>バージョン</span><span>1.0.0</span></div>
      <div class="row"><span>ビルド</span><span class="build">10（新アイコン）</span></div>
      <div class="row"><span>提出状態</span><span><b>Waiting for Review</b></span></div>
      <div class="row"><span>CI ログ</span><span><code>final state=WAITING_FOR_REVIEW</code></span></div>
    </div>
    <p style="margin-top:14px;font-size:13px;color:#6e6e73;">審査通過後のみ: 価格と配信可能状況 → 配信地域をオン</p>
  </div>
</div>
</body>
</html>
