<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: #f5f5f7; color: #1d1d1f; }
  #capture-root { width: 1180px; background: #f5f5f7; }
  .top { background: #fff; border-bottom: 1px solid #d2d2d7; padding: 14px 24px; font-size: 15px; font-weight: 600; }
  .main { padding: 28px 32px; }
  h1 { font-size: 28px; margin-bottom: 6px; }
  .sub { color: #6e6e73; font-size: 14px; margin-bottom: 20px; }
  .tabs { display: flex; gap: 24px; border-bottom: 1px solid #d2d2d7; margin-bottom: 20px; font-size: 14px; }
  .tabs .on { border-bottom: 2px solid #0071e3; padding-bottom: 10px; font-weight: 600; color: #0071e3; }
  .tabs span { color: #6e6e73; padding-bottom: 10px; }
  .card { background: #fff; border: 1px solid #d2d2d7; border-radius: 12px; overflow: hidden; max-width: 900px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; background: #fafafa; padding: 12px 16px; border-bottom: 1px solid #e8e8ed; color: #6e6e73; font-weight: 500; }
  td { padding: 14px 16px; border-bottom: 1px solid #e8e8ed; }
  .btn { background: #0071e3; color: #fff; border-radius: 980px; padding: 8px 16px; font-size: 13px; font-weight: 600; display: inline-block; margin-bottom: 16px; }
  .hl { background: #fff3cd; }
  code { font-family: ui-monospace, monospace; font-size: 13px; }
</style>
</head>
<body>
<div id="capture-root">
  <div class="top">App Store Connect › Users and Access › Integrations</div>
  <div class="main">
    <h1>App Store Connect API</h1>
    <p class="sub">Issuer ID: <code>2c64e8a7-ab21-4110-afdf-b182c678cc8c</code></p>
    <div class="tabs"><div class="on">Team Keys</div><span>Individual Keys</span></div>
    <div class="btn hl">＋ Generate API Key</div>
    <div class="card">
      <table>
        <tr><th>Name</th><th>Key ID</th><th>Access</th><th>Download</th></tr>
        <tr class="hl"><td>OpenCI Upload</td><td><code>P8W74LR2GH</code></td><td>App Manager</td><td>Download API Key (.p8)</td></tr>
      </table>
    </div>
    <p style="margin-top:14px;font-size:13px;color:#6e6e73;">⚠️ .p8 は1回しかダウンロード不可 → ios-signing/ に保存</p>
  </div>
</div>
</body>
</html>
